      *Wikipedia:*
      ❍ /wiki <query>: Search Wikipedia for your query
      *Wallpapers:*
      ❍ /wall <query>: Get a wallpaper from AlphaCoders
      *Text To Speech:*
      ❍ /texttospeech <text>: Convert a text message to a voice message
      *Books:*
      ❍ /book <book name>: Get instant download link of a book
      *Cricket Score:*
      ❍ /cs: Get live cricket score
      *Phone Info:*
      ❍ /phone [phone no]: Get phone number information
      *Bass Boosting:*
      ❍ /bassboost: Reply to music to bass boost it
music play:
  help: |
      {BOT_NAME} Music : Help Menu

      ╒════「 Setup Guide 」 │1. Promote bot as admin (with manage video chats). │2. Start the Group Voice Chat. │3. Play songs using `/play [song name/link]` or reply to audio. ╘══════════════════

      ╒════「 Play Commands 」 ├ /play [song name/link/reply] : Play via YouTube, Spotify, etc. ├ /vplay [song name/link/reply] : Play video stream. ├ /playforce [song name/link/reply] : Force play (skips current). ├ /vplayforce [song name/link/reply] : Force play video stream. ╘══════════════════

      ╒════「 Playlists & Queue 」 ├ /queue : Shows current playing queue. ├ /playlist : Views your personal playlist. ├ /addplaylist [query/link] : Adds a song to your personal playlist. ├ /delplaylist [number] : Removes a song from your personal playlist. ├ /playplaylist : Plays your personal playlist. ├ /gplaylist : Views the group playlist. ├ /addgplaylist [query/link] : Adds a song to the group playlist. ├ /delgplaylist [number] : Removes a song from the group playlist. ├ /playgplaylist : Plays the group playlist. ╘══════════════════

      ╒════「 Downloads 」 ├ /song [query/link] : Download audio file. ├ /vsong [query/link] : Download video file. ╘══════════════════

      ╒════「 Admin Commands 」 ├ /pause : Pauses music stream. ├ /resume : Resumes music stream. ├ /skip : Skips current track. ├ /stop or /end : Stops streaming and clears queue. ├ /volume or /vol [1-200] : Adjust assistant audio volume. ├ /settings or /playmode : Open settings menu. ├ /reload : Reloads admin cache list. ╘══════════════════
news:
  help: |
      *News & Information:*

      Fetch the latest global headlines across multiple portals and gates.

      *Commands:*
      ❍ /news [category]: Fetch the latest headlines from global gates.
      ❍ /headlines: Quick top headlines from your preferred category.
      ❍ /newsset category [name]: Set your resonance category (default category).
      ❍ /newsset topics [keywords]: Filter stories by specific keywords.
      *Available Gates:* `world`, `tech`, `gaming`, `anime`, `science`, `business`, `sports`, `health`, `entertainment`
pdf:
  help: |
      *PDF Converter:*

      Convert your images to PDF documents instantly. Perfect for scanned homework or online classes.

      *Commands:*
      ❍ /pdf: Reply to an image (as document) or start a multi-image PDF session.
      ❍ /done: Compile and finish your active PDF session.
      ❍ /cancel: Cancel the active session and discard temporary images.
ping:
  help: |
      Retrieve bot ping, service uptime, and host system statistics.

      👤 *User Commands:*
      ➛ /ping: View bot latency.
      ➛ /pingall: Check ping to Telegram and API databases.
      ➛ /uptime or /up: View operational duration.

      🛡️ *Admin Commands:*
      ➛ /stats or /statistics: View detailed host hardware metrics and software/bot stats.
pipes:
  help: |
      *THIS MODULE IS ONLY FOR DEVS*

      Use this module to create a pipe that will forward messages of one chat/channel to another.

      ❍ /activate_pipe [FROM_CHAT_ID] [TO_CHAT_ID] [BOT|USERBOT] : Active a pipe.
      ❍ /deactivate_pipe [FROM_CHAT_ID] : Deactivate a pipe.
      ❍ /show_pipes : Show all the active pipes.
      *Note:*
      - These pipes are only temporary, and will be destroyed on restart.
status tracking:
  help: |
      👤 *User Status Tracking:* Monitor user online/offline status and typing indicators in accessible group chats.

      *Commands:*
      ❍ /statuscheck [username/user_id]: Monitor presence type (Online, Typing, Recording, Uploading, Offline) for a user.
purges:
  help: |
      *Admins only:*
      ❍ /del: deletes the message you replied to
      ❍ /purge: deletes all messages between this and the replied to message (requires confirmation button clicks).
      ❍ /spurge: silently deletes all messages between this and the replied to message (no confirmation or notifications).
      ❍ /purge <number>: if replied to with a number, deletes that many messages from target message, if sent normally in group then delete from current to previous messages
      ❍ /purgeuser: purge recent messages from a specific user (reply to their message).
      ❍ /purgefrom: marks a start point to purge from
      ❍ /purgeto: marks the end point, messages bet to and from are deleted
quotly:
  help: |
      💬 *Quotly*

      Generate high-quality stickers from chat messages!

      *Commands:*
      - `/q`: Reply to a message to generate a quote sticker.
      - `/qr`: Generate a quote that includes the replied-to message reference in the header.
      - `/fq [text]`: Reply to a user to fake their quote, or fakes yourself if not a reply.
      *Modifiers / Flags:*
      - `!png` / `!file`: Send output as PNG document.
      - `!stories` / `!story`: Render in 720x1280 Stories format.
      - `!anon` / `!hide`: Anonymize/hide author name and avatar.
      - `!reply` / `r`: Force reply context.
      *Parameters:*
      - `color`: Hex code (e.g. #1b1429),preset, or preset words (e.g. random, transparent).
      - `emojiBrand`: apple, google, twitter, blob, joypixels.
      - `sScale`: Custom scale (e.g. s1.5, s2, s3).
reminders:
  help: |
      *Reminders System:*

      This module lets you set up to 20 reminders per group/PM.

      *Commands:*
      ❍ /remind <time> <text>: Set a reminder for given time, usage is the same as a mute command
      ❍ /reminders: List all the reminders for current chat
      ❍ /clearreminder <timestampID>: Remove the reminder of the given timestamp ID from the list
      ❍ /clearallreminders: Clear all saved reminders (owner only)
      *Parameters:*
      - *TimestampID:* An ID number listed under each reminder, used to remove a reminder
      - *Time:* 1d (days), 1h (hours), 1m (minutes), or 30s (seconds)
      *Notes:*
      - You can only supply one time variable: day(s), hour(s), minute(s), or seconds
      - The shortest reminder can be 30 seconds
      - Reminders are limited to 512 characters per reminder
      - Only group admins can set up reminders
      *Examples:* `/remind 2h You need to sleep!` This will send a reminder with the text after 2 hours

      `/clearreminder 1631378953` Removes the reminder of the specified timestamp ID
sed/regex:
  help: |
      - `s/<text1>/<text2>(/<flag>): Reply to a message with this to perform a sed operation on that message, replacing all \ occurrences of 'text1' with 'text2'. Flags are optional, and currently include 'i' for ignore case, "g' for global, \ or nothing. Delimiters include `/`, `\\_`, `|`, and `:`. Text grouping is supported. The resulting message cannot be \ larger than 4096 characters.
      *Reminder:* Sed uses some special characters to make matching easier, such as these: `+*.?` and `\\\\` If you want to use these characters, make sure you escape them!
      *Example:* \\?.
session gen:
  help: |
      🔑 *Session Generator*

      Generate string sessions for Pyrogram or Telethon directly inside the bot!

      *Commands:*
      - `/sgen` - Start the interactive string session generation process (available in PM/Private chat only).
tag alert:
  help: |
      Get notified when someone mentions you in a group!

      *Commands:*
      - `/tagalert` - Check your current tag alert status
      - `/tagalert on` - Enable tag alerts in this group
      - `/tagalert off` - Disable tag alerts in this group
      *How it works:* 1. Enable tag alerts in the groups you want 2. When someone mentions you (using @username or by tagging you) 3. You receive a private message from the bot with the mention
      *Note:* You must start a private chat with the bot first to receive alerts!
translation:
  help: |
      🌐 *Translation & Text-to-Speech*

      Translate languages and convert text to spoken audio.

      *Commands:*
      - `/tr` (or `/tl`, `/translate`) <lang_code> - Reply to a message to translate it (auto-detects source language).
      - `/tr` <source>//<target> - Reply to translate from source to target (e.g. `/tr en//fr`).
      - `/tr` <target> <text> - Translate the specified text to target language directly.
      - `/languages` (or `/lang`) - View the list of supported language codes.
      - `/tts` <text> - Convert the specified text to a playable voice note.
      - `/tts` <lang_code> <text> - Convert text to voice note in target language (e.g. `/tts es hola`).
      - `/tts` - Reply to any text message to convert it to a voice note.
upscale:
  help: |
      🖼 *Image Upscaler*

      Enhance and upscale images to higher resolution!

      *Commands:*
      - `/upscale` (or `/enhance`) - Reply to a photo or PNG/JPG document to upscale it.
bios/abouts:
  help: |
      Manage user bios, about messages, and personal information card.

      👤 *User Commands:*
      ❍ /me: Get your or replied user's info.
      ❍ /setme <text>: Set your about me info.
      ❍ /bio: Get your or replied user's bio.
      ❍ /setbio <text>: Reply to a user's message to set their bio.
      ❍ /myinfo: Retrieve your detailed user details profile card.
waifu:
  help: |
      *Waifu & Couples:*
      ❍ /couple / /ship: Choose the couple of the day from the group members
      ❍ /mywaifu: Find your waifu of the day in this chat with a bond percentage
      ❍ /myhusbando: Find your husbando of the day in this chat with a bond percentage
warnings:
  help: |
      *Warnings System:*
      *User Commands:*
      ❍ /warns <userhandle>: Get a user's number and reason of warnings
      ❍ /warnlist: List all current warning filters
      *Admin only:*
      ❍ /warn <userhandle>: Warn a user. After 3 warns, the user will be banned from the group. Can also be used as a reply
      ❍ /resetwarn <userhandle>: Reset the warnings for a user. Can also be used as a reply
      ❍ /rmwarn, /unwarn <userhandle>: Remove user's latest warning. Can also be used as a reply
      ❍ /addwarn <keyword> <reply message>: Set a warning filter on a certain keyword. If you want your keyword to be a sentence, enclose it in quotes, like this: `/addwarn "very angry" This is an angry user`
      ❍ /nowarn <keyword>: Stop a warning filter
      ❍ /warnlimit <num>: Set the warning limit
      ❍ /strongwarn <on/yes/off/no>: If set to on, exceeding the warn limit will result in a ban. Otherwise, will just kick
      ❍ /setwarnmode <ban/kick/mute/tmute/tban>: Set the action to perform when warnings have been exceeded
weather:
  help: |
      *🌤️ Weather Information:*

      Get current weather conditions for any city in the world!

      *Commands:*
      ❍ /weather <city>: Get weather information
      *Examples:*
      - `/weather London` - London weather
      - `/weather New York` - New York weather
      - `/weather Tokyo` - Tokyo weather
      *Features:*
      - 🌡️ Current temperature & feels like
      - 🌥️ Weather conditions with icons
      - 💧 Humidity percentage
      - 💨 Wind speed
      - 🌅🌇 Sunrise & sunset times
      - ☀️ UV Index
      - ⚡ Fast with smart caching
      - 🔄 Quick refresh button
      - °C/°F toggle
      *Note:* Weather data cached for 10 minutes
greetings:
  help: |
      Greet new members with customized welcome templates.

      *Admin Commands:*
      - `/welcome <on/off>` - Enable/disable welcome messages.
      - `/welcome` - View current welcome message settings.
      - `/welcome_mode <text/image>` - Set welcome mode (image mode generates card graphics).
      - `/setwelcome <text>` - Set custom welcome message (supports HTML).
      - `/setgoodbye <text>` - Set custom goodbye message.
      - `/resetwelcome` - Reset welcome message to default.
      - `/resetgoodbye` - Reset goodbye message to default.
      - `/cleanwelcome <on/off>` - Delete the previous welcome message.
      - `/cleanservice <on/off>` - Delete Telegram's service join/left messages.
      - `/welcomehelp` - View tags and formatting options.
      - `/welcomemute <on/off>` - Mute new members on join.
      - `/captcha <on/off>` - Toggle math captcha verification for new joins.
      - `/welcomemutehelp` - Get information about welcome mutes.
whatanime:
  help: |
      Find anime from an image or GIF using trace.moe!

      *Commands:*
      - `/whatanime` - Reply to an image/GIF to find the anime
      *How to use:* 1. Send or forward an anime screenshot/GIF 2. Reply to it with `/whatanime` 3. Wait for the bot to find the anime!
      *Note:* Works best with clear, unedited anime screenshots.
wikipedia:
  help: |
      *🌐 Wikipedia Search:*

      Search Wikipedia for any topic!

      *Commands:*
      ❍ /wiki <query>: Search Wikipedia for a term
      *Examples:*
      - `/wiki Python programming`
      - `/wiki Elon Musk`
      - `/wiki Quantum physics`

# Announcements module
announce:
  help: |
    *Announcements:*
    Toggle admin action announcements in the group chat.

    *Commands:*
    ❍ /announce <on/off/yes/no>: Toggle announcements of admin actions in the chat.

# CleanLinked / Anti-Channel Pin module
antilinkedchannel:
  help: |
    *CleanLinked / Anti-Channel Pin:*
    Automatically unpin or delete forwarded posts from linked channels.

    *Commands:*
    ❍ /cleanlinked <on/off/yes/no>: Toggle deletion of automatically forwarded channel messages in the chat.
    ❍ /antichannelpin <on/off/yes/no>: Toggle unpinning of automatically forwarded channel messages in the chat.

# Clear Commands module
clear_cmd:
  help: |
    *Clear Commands:*
    This module allows you to automatically delete command outputs after a certain time to keep your group chat clean.

    *Commands:*
    ❍ /clearcmd: View list of configured commands and delete timers in this chat.
    ❍ /clearcmd list: View list of all clearable commands.
    ❍ /clearcmd <command> <time>: Set a delete timer (5 to 300 seconds) for a command (e.g. `/clearcmd ping 10`).
    ❍ /clearcmd <command> restore: Stop auto-deleting a command's output.
    ❍ /clearcmd restore: Stop auto-deleting outputs for all commands.

# Blue Text Cleaner module
cleaner:
  help: |
    *Blue Text Cleaner:*
    Blue text cleaner removes any made-up commands that people send in your chat.

    *Commands:*
    ❍ /cleanbluetext <on/off/yes/no>: Clean commands after sending.
    ❍ /ignorecleanbluetext <word>: Prevent auto-cleaning of the command.
    ❍ /unignorecleanbluetext <word>: Remove prevent auto-cleaning of the command.
    ❍ /listcleanbluetext: List currently whitelisted commands.

    *Disaster-only commands:*
    ❍ /ignoreglobalcleanbluetext <word>: Globally ignore bluetext cleaning of saved words.
    ❍ /unignoreglobalcleanbluetext <word>: Remove said command from global cleaning list.

# Zombies module
zombies:
  help: |
    *Zombies (Deleted Accounts):*
    Identify and remove deleted/inactive accounts from your group chat.

    *Commands:*
    ❍ /zombies: Scan for deleted accounts in the chat.
    ❍ /zombies clean: Ban and kick all deleted accounts from the chat.

