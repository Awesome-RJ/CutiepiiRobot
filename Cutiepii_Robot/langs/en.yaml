      📙 English Dictionary:
      ❍ /define <text>: Get the definition of a word or expression (example: /define kill)
      ❍ /spell: Reply to a message to get a grammar-corrected version
      ❍ /synonyms <word>: Find synonyms of a word
      ❍ /antonyms <word>: Find antonyms of a word

      💳 CC Checker:
      ❍ /au [cc]: Stripe Auth given CC
